<!doctype html>
<html><head><meta charset="utf-8"><title>Gary vs the agency — SellTheClick reel</title>
<style>
html,body{margin:0;background:#111}
body{display:flex;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#E4553A;font-family:'Inter Display','Inter',system-ui,sans-serif;transform-origin:top center}
#world{position:absolute;inset:0;transform-origin:50% 75%}
#floor{position:absolute;left:0;right:0;bottom:0;height:520px;background:#D8CAB4}
#floor:before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:rgba(0,0,0,.08)}
.char{position:absolute;transform-origin:50% 100%}
.char img.pose{display:block;position:relative}
.char img.shadow{position:absolute;left:50%;bottom:-38px;width:80%;transform:translateX(-50%)}
#gary{left:40px;bottom:330px}
#gary img.pose{height:1000px}
#priya{right:70px;bottom:430px}
#priya img.pose{height:860px}
#priya{right:100px;bottom:470px}
#priya img.pose{height:760px}
#cap{position:absolute;left:70px;right:70px;top:250px;color:#F7F1E6;font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.025em}
#cap span{display:inline-block;will-change:transform}
.stamp{position:absolute;padding:10px 26px 14px;background:#F2C94C;color:#1B1B1B;font-size:96px;font-weight:900;letter-spacing:-.03em;border-radius:6px;box-shadow:0 10px 0 rgba(0,0,0,.18);white-space:nowrap}
.stamp.dark{background:#1B1B1B;color:#F2C94C}
.stamp.cream{background:#F7F1E6;color:#E4553A}
#panel{position:absolute;left:110px;right:110px;top:640px;height:700px;background:#FBF8F2;border-radius:34px;box-shadow:0 30px 0 rgba(0,0,0,.18);padding:56px 60px;box-sizing:border-box;color:#1B1B1B;opacity:560}
#panel h3{margin:0;font-size:40px;font-weight:700;letter-spacing:-.01em;color:#E4553A}
#panel h2{margin:8px 0 40px;font-size:62px;font-weight:900;letter-spacing:-.03em}
.row{display:flex;align-items:center;gap:24px;margin:26px 0;font-size:40px;font-weight:700}
.row b{width:150px}
.bar{flex:1;height:44px;background:#EDE6DA;border-radius:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#1B1B1B;border-radius:22px}
.row.win .bar i{background:#E4553A}
.row em{font-style:normal;font-size:30px;color:#E4553A;width:170px;text-align:right}
#endcard{position:absolute;inset:0;background:#1B1B1B;color:#F7F1E6;opacity:560;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box}
#endcard h1{font-size:150px;line-height:.92;margin:0 0 40px;font-weight:900;letter-spacing:-.04em}
#endcard p{font-size:56px;line-height:1.15;margin:0 0 70px;font-weight:600;color:#D8CAB4}
#endcard .url{align-self:flex-start;background:#E4553A;color:#fff;font-size:62px;font-weight:800;padding:22px 44px 28px;border-radius:60px}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:multiply}
</style></head>
<body>
<div id="stage">
  <div id="world">
    <div id="floor"></div>
    <div class="char" id="priya"><img class="shadow" src="characters/priya/shadow.webp"><img class="pose" id="priyaPose" src="characters/priya/idle.webp"></div>
    <div class="char" id="gary"><img class="shadow" src="characters/gary/shadow.webp"><img class="pose" id="garyPose" src="characters/gary/idle.webp"></div>
    <div id="panel">
      <h3>SellTheClick · pre-launch ad score</h3>
      <h2>Which ad sells — before you spend</h2>
      <div class="row"><b>Ad A</b><div class="bar"><i data-w="38"></i></div><em></em></div>
      <div class="row win"><b>Ad B</b><div class="bar"><i data-w="86"></i></div><em>likely winner</em></div>
      <div class="row"><b>Ad C</b><div class="bar"><i data-w="52"></i></div><em></em></div>
      <div class="row"><b>Ad D</b><div class="bar"><i data-w="24"></i></div><em>kill</em></div>
    </div>
  </div>
  <div id="cap"></div>
  <div id="stamps"></div>
  <div id="endcard">
    <h1>Stop flying blind.</h1>
    <p>Know which ad will sell before you spend a dollar on it.</p>
    <div class="url">tryselltheclick.com</div>
  </div>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
// ---- beat sheet: t = start (s). Retime these from the voiceover transcript. ----
const BEATS = [
  {t:0.26,  g:'idle',     p:'idle',    cap:"I don't give a damn about the explanations you give me on Wednesday morning."},
  {t:3.46,  g:'point',    p:'nervous', cap:"I didn't hire you to explain why things aren't working.", punch:true},
  {t:6.56,  g:'shout',    p:'nervous', cap:"F#@%ing…", punch:true,
     stamps:[{s:'CAC',dt:0.46,x:110,y:1080,r:-7},{s:'CTR',dt:0.92,x:560,y:1170,r:5,c:'cream'},{s:'AD FATIGUE',dt:1.38,x:190,y:1320,r:-3,c:'dark'}]},
  {t:9.69, g:'facepalm', p:'nervous', cap:"Do you think I care what that sh*t is?"},
  {t:11.22, g:'point',    p:'idle',    cap:"Man, I need SALES.", punch:true},
  {t:12.81, g:'hold',     p:'idle',    cap:"My SaaS is $25 a month. I've spent $5,000 on ads.",
     stamps:[{s:'$25/mo',dt:0.94,x:120,y:1200,r:-5,c:'cream'},{s:'$5,000 spent',dt:2.27,x:380,y:1330,r:4}]},
  {t:17.35, g:'shrug',    p:'nervous', cap:"Zero paid sign-ups. Ten free ones.",
     stamps:[{s:'0 paid',dt:0.33,x:130,y:1120,r:-6,c:'dark'},{s:'10 free',dt:1.31,x:560,y:1200,r:5,c:'cream'}]},
  {t:20.29, g:'facepalm', p:'idle',    cap:"Even if we get lucky and 8% go paid… we make a hundred bucks.",
     stamps:[{s:'$100 back',dt:2.44,x:300,y:1360,r:-4}]},
  {t:24.64, g:'point',    p:'nervous', cap:"I just wanna know when we make 3X our spend. Period.", punch:true,
     stamps:[{s:'3X?',dt:1.43,x:640,y:1260,r:6,c:'dark'}]},
  {t:28.21, g:'count',    p:'nervous', cap:"What are my odds of selling in…",
     stamps:[{s:'7 days',dt:1.04,x:120,y:1120,r:-5,c:'cream'},{s:'14 days',dt:1.57,x:420,y:1210,r:4,c:'cream'},{s:'21 days',dt:2.09,x:170,y:1320,r:-3,c:'cream'}]},
  {t:31.97, g:'point',    p:'show',    cap:"Why don't you just talk to these guys? tryselltheclick.com — they cracked the code.", panel:true},
  {t:36.50, g:'idle',     p:'smile',   cap:"", end:true},
];
const DUR = 41.1;
const CH = {gary:'characters/gary/'};
const MAP = {hold:'idle', shrug:'shout', count:'point'};  // poses not generated yet -> closest available
const gp = p => MAP[p] || p;

// preload every image
const srcs = new Set();
for (const b of BEATS) srcs.add(CH.gary + gp(b.g) + '.webp');
srcs.add('characters/priya/idle.webp');
window.assetsReady = Promise.all([...srcs].map(s => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }));

const $ = id => document.getElementById(id);
const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const setSrc = (el, s) => { if (!el.src.endsWith(s)) el.src = s; };

let lastCap = -1;
function seek(t) {
  const tq = Math.floor(t * 12) / 12;   // stop-motion clock for the characters
  let i = 0; while (i + 1 < BEATS.length && BEATS[i + 1].t <= t) i++;
  const b = BEATS[i], since = t - b.t, sinceQ = tq - b.t;

  // characters: pose swap + pop + breathe + blink
  setSrc($('garyPose'), CH.gary + gp(b.g) + '.webp');
  const prev = BEATS[i - 1];
  const gPop = (!prev || gp(prev.g) !== gp(b.g)) && sinceQ < .25;
  const gBr = 1 + .012 * Math.sin(tq * Math.PI * 2 / 2.6);
  const angry = ['shout','point'].includes(b.g) ? Math.round(Math.sin(tq * 40)) * 3 : 0;  // jitter on 12fps
  $('gary').style.transform = `translateX(${angry}px) scale(${gPop ? 1.05 : 1}, ${(gPop ? .95 : 1) * gBr})`;
  // Priya has one photo, so she acts with movement: flinch, nervous wobble, lean in, settle
  const pBr = 1 + .01 * Math.sin((tq + .8) * Math.PI * 2 / 3.2);
  let px = 0, py = 0, pr = 0, ps = 1;
  if (b.p === 'nervous') { pr = Math.round(Math.sin(tq * 23)) * 1.6; px = 14; ps = .97; }   // shrinking back, wobbling
  if (b.g === 'shout' && sinceQ < .5) { py = -26 * Math.sin(Math.PI * clamp(sinceQ / .5)); px = 22; }  // flinch-hop when he yells
  if (b.p === 'show') { const k = easeOut(clamp(sinceQ / .4)); px = -60 * k; pr = -3 * k; ps = 1 + .04 * k; }  // leans in toward him
  if (b.p === 'smile') { px = -30; }
  $('priya').style.transform = `translate(${px}px, ${py}px) rotate(${pr}deg) scale(${ps}, ${ps * pBr})`;

  // camera punch-in on angry beats
  const punch = b.punch ? 1 + .035 * easeOut(clamp(since / .18)) - .02 * clamp((since - .18) / 1.2) : 1;
  $('world').style.transform = `scale(${punch})`;

  // caption: words drop in one by one
  const words = b.cap ? b.cap.split(' ') : [];
  if (lastCap !== i) { $('cap').innerHTML = words.map(w => `<span>${w}</span>`).join(' '); lastCap = i; }
  [...$('cap').children].forEach((el, k) => {
    const p = clamp((since - k * .07) / .22);
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - easeOut(p)) * -60}px) rotate(${(1 - p) * -5}deg)`;
  });

  // stamps
  $('stamps').innerHTML = (b.stamps || []).map(s => {
    const p = clamp((since - s.dt) / .28);
    if (p <= 0) return '';
    const sc = back(p);
    return `<div class="stamp ${s.c || ''}" style="left:${s.x}px;top:${s.y}px;transform:rotate(${s.r}deg) scale(${sc})">${s.s}</div>`;
  }).join('');

  // dashboard panel (from the "talk to these guys" beat until the end card)
  const panelStart = BEATS.find(x => x.panel).t, endStart = BEATS.find(x => x.end).t;
  const pp = clamp((t - panelStart - .6) / .35);
  $('panel').style.opacity = t >= endStart ? 1 : pp;
  $('panel').style.transform = `translateY(${(1 - easeOut(pp)) * 80}px) rotate(${(1 - pp) * 3}deg)`;
  document.querySelectorAll('#panel .bar i').forEach((el, k) => {
    const q = clamp((t - panelStart - 1.1 - k * .25) / .9);
    el.style.width = (easeOut(q) * el.dataset.w) + '%';
  });

  // end card
  const e = clamp((t - endStart) / .3);
  $('endcard').style.opacity = e;
  $('endcard').querySelectorAll('h1,p,.url').forEach((el, k) => {
    const q = clamp((t - endStart - .2 - k * .35) / .3);
    el.style.opacity = q; el.style.transform = `translateY(${(1 - easeOut(q)) * 40}px)`;
  });
}
window.seek = seek; window.DUR = DUR;

// live preview in a normal browser (rendering uses seek() directly)
if (!navigator.webdriver) {
  const fit = () => { $('stage').style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`; };
  fit(); addEventListener('resize', fit);
  const audio = new Audio('voiceover.mp3'); let start = null;
  addEventListener('click', () => { start = performance.now(); audio.currentTime = 0; audio.play().catch(() => {}); });
  (function loop() { const now = performance.now(); seek(start === null ? ((now / 1000) % DUR) : ((now - start) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
</body></html>
